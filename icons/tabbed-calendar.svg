<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a80"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeeff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- rings: the calendar's tabs -->
  <rect x="17" y="6" width="6" height="13" rx="3" fill="#7fbcff"/>
  <rect x="41" y="6" width="6" height="13" rx="3" fill="#7fbcff"/>
  <!-- back page -->
  <rect x="11" y="12" width="46" height="42" rx="4" fill="#6fb2ff"/>
  <!-- front page -->
  <rect x="7" y="16" width="46" height="42" rx="4" fill="url(#pg)"/>
  <!-- month band -->
  <path d="M7 20a4 4 0 0 1 4-4h38a4 4 0 0 1 4 4v7H7z" fill="#0a3fb0"/>
  <!-- day grid -->
  <g fill="#9fc3ee">
    <rect x="13" y="32" width="6" height="5" rx="1.2"/>
    <rect x="22" y="32" width="6" height="5" rx="1.2"/>
    <rect x="31" y="32" width="6" height="5" rx="1.2"/>
    <rect x="40" y="32" width="6" height="5" rx="1.2"/>
    <rect x="13" y="41" width="6" height="5" rx="1.2"/>
    <rect x="22" y="41" width="6" height="5" rx="1.2"/>
    <rect x="31" y="41" width="6" height="5" rx="1.2"/>
    <rect x="13" y="50" width="6" height="4" rx="1.2"/>
    <rect x="22" y="50" width="6" height="4" rx="1.2"/>
  </g>
  <!-- today -->
  <rect x="40" y="41" width="6" height="5" rx="1.2" fill="#0a3fb0"/>
  <rect x="31" y="50" width="6" height="4" rx="1.2" fill="#0a3fb0" opacity="0.55"/>
</svg>
