<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a80"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeeff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- tabs -->
  <rect x="7" y="9" width="17" height="8" rx="2.5" fill="#7fbcff"/>
  <rect x="24" y="7" width="19" height="10" rx="2.5" fill="#ffffff"/>
  <rect x="43" y="9" width="14" height="8" rx="2.5" fill="#7fbcff" opacity="0.8"/>
  <!-- back page -->
  <rect x="13" y="18" width="42" height="34" rx="3.5" fill="#6fb2ff"/>
  <!-- front page -->
  <rect x="7" y="22" width="42" height="34" rx="3.5" fill="url(#pg)"/>
  <!-- W -->
  <text x="28" y="48" text-anchor="middle" font-family="Arial Black, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="26" fill="#0a3fb0">W</text>
</svg>
